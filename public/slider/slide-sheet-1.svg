<svg width="380" height="240" viewBox="0 0 380 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="240" fill="#F8FAFC"/>
  
  <!-- Mini Spreadsheet Layout -->
  <rect x="20" y="20" width="340" height="200" rx="8" fill="white" stroke="#E2E8F0" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
  
  <!-- Columns -->
  <line x1="20" y1="60" x2="360" y2="60" stroke="#E2E8F0"/>
  <line x1="120" y1="20" x2="120" y2="220" stroke="#E2E8F0"/>
  <line x1="240" y1="20" x2="240" y2="220" stroke="#E2E8F0"/>
  
  <!-- Header -->
  <rect x="25" y="35" width="80" height="10" rx="4" fill="#94A3B8"/>
  <rect x="135" y="35" width="80" height="10" rx="4" fill="#94A3B8"/>
  <rect x="255" y="35" width="80" height="10" rx="4" fill="#94A3B8"/>
  
  <!-- Row 1 -->
  <rect x="20" y="60" width="340" height="40" fill="#F8FAFC"/>
  <rect x="30" y="75" width="80" height="10" rx="4" fill="#CBD5E1"/>
  <rect x="130" y="75" width="100" height="10" rx="4" fill="#CBD5E1"/>
  <rect x="250" y="70" width="80" height="20" rx="10" fill="#BBF7D0"/> <!-- Green Status -->
  
  <!-- Row 2 -->
  <rect x="20" y="100" width="340" height="40" fill="white"/>
  <rect x="30" y="115" width="80" height="10" rx="4" fill="#E2E8F0"/>
  <rect x="130" y="115" width="100" height="10" rx="4" fill="#E2E8F0"/>
  <rect x="250" y="110" width="80" height="20" rx="10" fill="#FEF08A"/> <!-- Yellow Status -->
  
  <!-- Row 3 Animation -->
  <rect x="20" y="140" width="340" height="40" fill="#EFF6FF"/> <!-- Blueish new row -->
  <rect x="30" y="155" width="60" height="10" rx="4" fill="#BFDBFE"/>
  <rect x="130" y="155" width="90" height="10" rx="4" fill="#BFDBFE"/>
  <circle cx="260" cy="160" r="10" fill="#3B82F6"/> <!-- Loading/Processing icon -->
  
  <!-- Cursor -->
  <path d="M180 160L190 175L185 180L175 165L180 160Z" fill="black" stroke="white"/>
  
  <!-- Highlight box -->
  <rect x="25" y="145" width="330" height="30" rx="4" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
