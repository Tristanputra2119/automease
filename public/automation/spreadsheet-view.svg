<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>
  
  <!-- Top Bar -->
  <rect width="800" height="64" fill="white" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.05))"/>
  <rect x="24" y="16" width="32" height="32" rx="4" fill="#0F9D58"/>
  <path d="M34 24H46M34 32H46M34 40H40" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <text x="72" y="38" font-family="sans-serif" font-weight="bold" font-size="18" fill="#444746">Orders Database</text>
  <rect x="230" y="24" width="80" height="20" rx="4" fill="#E8F0FE"/>
  <text x="245" y="38" font-family="sans-serif" font-size="12" fill="#1967D2">Saved</text>

  <!-- Toolbar -->
  <rect y="64" width="800" height="40" fill="#F8F9FA" stroke="#E0E3E7"/>
  <path d="M24 84H776" stroke="none"/> <!-- Just for spacing imagination -->
  <rect x="24" y="74" width="20" height="20" fill="#F1F3F4" rx="2"/>
  <rect x="52" y="74" width="20" height="20" fill="#F1F3F4" rx="2"/>
  <rect x="90" y="74" width="100" height="20" fill="#fff" stroke="#E0E3E7" rx="2"/>
  
  <!-- Spreadsheet Grid Area -->
  <rect y="104" width="800" height="496" fill="white"/>
  
  <!-- Column Headers -->
  <g fill="#F8F9FA">
    <rect y="104" width="800" height="32" stroke="#E0E3E7"/>
    <rect width="50" height="32" x="0" y="104" stroke="#E0E3E7"/>
    <rect width="180" height="32" x="50" y="104" stroke="#E0E3E7"/>
    <rect width="200" height="32" x="230" y="104" stroke="#E0E3E7"/>
    <rect width="180" height="32" x="430" y="104" stroke="#E0E3E7"/>
    <rect width="190" height="32" x="610" y="104" stroke="#E0E3E7"/>
  </g>
  
  <g font-family="sans-serif" font-weight="bold" font-size="12" fill="#5F6368" transform="translate(0, 125)">
     <text x="20">#</text>
     <text x="60">Order ID</text>
     <text x="240">Customer Name</text>
     <text x="440">Status</text>
     <text x="620">Automation</text>
  </g>

  <!-- Row 1: Completed -->
  <g transform="translate(0, 136)">
     <rect width="800" height="48" fill="white" stroke="#E0E3E7" stroke-width="0.5"/>
     <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">1</text>
     <text x="60" y="30" font-family="sans-serif" font-weight="500" font-size="14" fill="#3C4043">#ORD-001</text>
     <text x="240" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">Sutha Raditya</text>
     
     <!-- Status Badge -->
     <rect x="440" y="12" width="100" height="24" rx="12" fill="#E6F4EA"/>
     <text x="460" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#137333">PAID</text>
     
     <!-- Automation Badge -->
     <rect x="620" y="12" width="120" height="24" rx="12" fill="#E8F0FE"/>
     <text x="635" y="28" font-family="sans-serif" font-size="12" fill="#1967D2">✓ WA Sent</text>
  </g>

  <!-- Row 2: Pending -->
  <g transform="translate(0, 184)">
     <rect width="800" height="48" fill="#F8FAFF" stroke="#E0E3E7" stroke-width="0.5"/> <!-- Active row highlights -->
     <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">2</text>
     <text x="60" y="30" font-family="sans-serif" font-weight="500" font-size="14" fill="#3C4043">#ORD-002</text>
     <text x="240" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">Tristan Putra</text>
     
     <rect x="440" y="12" width="100" height="24" rx="12" fill="#FEF7E0"/>
     <text x="455" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#B06000">PENDING</text>
     
     <rect x="620" y="12" width="120" height="24" rx="12" fill="#FCE8E6"/>
     <text x="635" y="28" font-family="sans-serif" font-size="12" fill="#C5221F">Waiting...</text>
  </g>

  <!-- Row 3: Completed -->
  <g transform="translate(0, 232)">
     <rect width="800" height="48" fill="white" stroke="#E0E3E7" stroke-width="0.5"/>
     <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">3</text>
     <text x="60" y="30" font-family="sans-serif" font-weight="500" font-size="14" fill="#3C4043">#ORD-003</text>
     <text x="240" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">Made Daliant</text>
     
     <rect x="440" y="12" width="100" height="24" rx="12" fill="#E6F4EA"/>
     <text x="460" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#137333">PAID</text>
     
     <rect x="620" y="12" width="120" height="24" rx="12" fill="#E8F0FE"/>
     <text x="635" y="28" font-family="sans-serif" font-size="12" fill="#1967D2">✓ WA Sent</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 280)">
     <rect width="800" height="48" fill="white" stroke="#E0E3E7" stroke-width="0.5"/>
     <text x="20" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">4</text>
     <text x="60" y="30" font-family="sans-serif" font-weight="500" font-size="14" fill="#3C4043">#ORD-004</text>
     <text x="240" y="30" font-family="sans-serif" font-size="14" fill="#3C4043">Christian R.</text>
     
     <rect x="440" y="12" width="120" height="24" rx="12" fill="#EDE7F6"/>
     <text x="455" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#673AB7">DELIVERED</text>
     
     <rect x="620" y="12" width="120" height="24" rx="12" fill="#E8F0FE"/>
     <text x="635" y="28" font-family="sans-serif" font-size="12" fill="#1967D2">✓ WA Sent</text>
  </g>

  <!-- Highlight Box (Simulating Selection) -->
  <rect x="47" y="184" width="753" height="48" fill="none" stroke="#1A73E8" stroke-width="2"/>
  <rect x="796" y="228" width="6" height="6" fill="#1A73E8"/>
</svg>
